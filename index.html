<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Birthday Pass | Barrister Esther Otsabomhe</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fdf8f5;
      color: #333;
      text-align: center;
      padding: 2em;
    }
    .card {
      max-width: 500px;
      margin: auto;
      background: #fff;
      padding: 2em;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      color: #c0392b;
    }
    .qr {
      margin-top: 20px;
    }
    .details {
      margin: 1.5em 0;
      font-size: 1.1em;
      line-height: 1.6em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 You're Invited!</h1>
    <p class="details">
      Dear Guest,<br/>
      You are warmly invited to celebrate the birthday of<br/>
      <strong>Barrister Esther Otsabomhe</strong><br/>
      📍 <strong>Lagos Continental Hotel</strong><br/>
      🏢 52a Kofo Abayomi St, Victoria Island, Lagos<br/>
      🕒 <strong>3:00 PM</strong><br/>
      🗓️ <strong>May 10, 2025</strong>
    </p>

    <div class="qr">
      <img
        src="https://chart.googleapis.com/chart?chs=200x200&cht=qr&chl=You are invited to Barrister Esther Otsabomhe's Birthday Party at Lagos Continental Hotel, 52a Kofo Abayomi St, Victoria Island, Lagos at 3PM on May 10, 2025. Welcome!"
        alt="QR Code Invitation"
      />
      <p>📱 Scan this code at the entrance</p>
    </div>
  </div>
</body>
</html>
